# Fine-tune of the converged prior_gulfstream_256_anneal model (step 1.2M,
# lr annealed to 0) at a 512x512 patch.
#
# WHY. At its own 256 geometry the model is unbiased and settled; at the full
# 576x936 frame it collapses the per-sample domain mean (sd ~0.1 sigma vs 0.7
# real for ssh) and acquires mean offsets (tau_x +0.4 sigma, uag/vag -0.9)
# that do not exist at patch scale. The 512 patch is the largest square the
# loader takes without changes (the frame is 576 tall) and covers most of the
# domain, so a short fine-tune here targets the patch -> full-frame gap
# directly. It does not target the under-dispersion (EKE ~0.45), which is
# already present at 256.
#
# HOW. Seeded by diffusion/remap_patch_ckpt.py from
#   aws_runs/runs/prior_gulfstream_256_anneal/checkpoints/ckpt_step1200000.pt
# (block names are per level resolution, so 32x32 -> 64x64 etc.). Both raw
# and EMA start from the source EMA. The step counter is kept at 1.2M so the
# EMA half-life rule does not restart; hence warmup = 1,200,000 (no warm-up,
# lr_at starts the cosine at progress 0) and steps = 1,260,000: 60k steps at
# batch 8 x 512^2 = the pixel budget of ~30k steps of the original recipe.
#
# Launch (one job, two lanes, see train_lanes.slurm):
#   OUT_DIR=/unity/g2/jvelasco/gitraw/hycom_sbda/aws_runs/runs \
#     sbatch train_lanes.slurm \
#       "diffusion/configs/prior_gulfstream_256_anneal_ft512.yaml:1:1 \
#        diffusion/configs/prior_gulfstream_ft512.yaml:1:2"
dataset: diffusion/datasets/gulfstream.yaml

# --- variables (unchanged) --------------------------------------------------
target: [ssh, sst, sss, uag, vag, tau_x, tau_y]
cond_vars: []
use_ocean_mask: false
use_doy: false
k_days: 1

# --- data / patches ----------------------------------------------------------
patch: 512                    # was 256
crop_mode: random             # grid mode has only 4 corners at 512; random =
                              # uniform corners, y0 in 0..64, x0 in 0..424
reject_land: false
ocean_frac: 0.5
crops_per_day: 8
norm_mode: anomaly

# --- climatology (unchanged) -------------------------------------------------
clim_vars: [sst, sss]
clim_mode: monthly
clim_full_record: true
val_gap_days: 0

# --- model (unchanged) -------------------------------------------------------
# Levels at 512 are 512/256/128/64. attn_resolutions [16] again selects no
# encoder/decoder level, so attention is the bottleneck block only -- which is
# exactly what the source weights contain (dec.32x32_in0 -> dec.64x64_in0).
# Adding levels here would leave their attention weights uninitialised.
arch: genda
model_channels: 64
channel_mult: [1, 2, 2, 2]
num_blocks: 2
attn_resolutions: [16]
dropout: 0.13

# --- EDM (unchanged) ---------------------------------------------------------
sigma_data: 0.5
sampler_steps: 32
s_churn: 10.0
s_noise: 1.0

# --- optimisation ------------------------------------------------------------
mode: diffusion
batch: 8                      # per rank; 8 x 512^2 = the pixels of 32 x 256^2 (~47 GB)
lr: 2.0e-5                    # peak of the fine-tune cosine (1/10 of the original)
lr_schedule: cosine
warmup: 1200000               # = resume step: no warm-up, cosine starts at progress 0
steps: 1260000                # 60k fine-tune steps, lr -> 0 here
loss_reduction: masked_mean
grad_clip: 0.0
grad_nan_to_num: true
ema_halflife_kimg: 50         # was 500: 50k images = 6.25k steps at batch 8, so the
                              # EMA follows the fine-tune instead of the 1.2M-step past
num_workers: 4

val_every: 10000              # 6 snapshots in checkpoints/ for the sweep
val_batches: 10

# --- sampling / eval ----------------------------------------------------------
k_members: 24
n_eval_days: 0

out: "${OUT_DIR:-/unity/g2/jvelasco/gitraw/hycom_sbda/aws_runs/runs}/prior_gulfstream_256_anneal_ft512"
