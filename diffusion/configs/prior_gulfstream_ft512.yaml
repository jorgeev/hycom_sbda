# Fine-tune of the 128-patch prior_gulfstream model (AWS, 3.125M steps,
# constant lr 2e-4) at a 512x512 patch. Companion of
# prior_gulfstream_256_anneal_ft512.yaml, same recipe, so the two source
# models can be compared after the same fine-tune; see that file's header for
# the reasoning and the launch line.
#
# Seeded by diffusion/remap_patch_ckpt.py from
#   aws_runs/runs/prior_gulfstream/ckpt.pt   (step 3,125,000)
# with both raw and EMA set to the source EMA (the raw weights of a
# constant-lr run are one point of its checkpoint-to-checkpoint swing).
#
# ATTENTION. The 128-patch model attends at its 16x16 level in four blocks
# (enc block0/1, bottleneck in0, dec block2). At 512 that level is 64x64, so
# attn_resolutions must be [64] for the names to match and for those blocks
# to exist; [16] would silently drop three of them (strict load refuses).
# This also means this model attends with 4096 tokens per block at 512, i.e.
# it keeps the context it was trained with -- unlike the 256 model, which has
# only the bottleneck block at any patch.
dataset: diffusion/datasets/gulfstream.yaml

# --- variables (unchanged) --------------------------------------------------
target: [ssh, sst, sss, uag, vag, tau_x, tau_y]
cond_vars: []
use_ocean_mask: false
use_doy: false
k_days: 1

# --- data / patches ----------------------------------------------------------
patch: 512                    # was 128
crop_mode: random
reject_land: false
ocean_frac: 0.5
crops_per_day: 8
norm_mode: anomaly

# --- climatology (unchanged) -------------------------------------------------
clim_vars: [sst, sss]
clim_mode: monthly
clim_full_record: true
val_gap_days: 0

# --- model -------------------------------------------------------------------
arch: genda
model_channels: 64
channel_mult: [1, 2, 2, 2]
num_blocks: 2
attn_resolutions: [64]        # was [16] at patch 128: same blocks, see header
dropout: 0.13

# --- EDM (unchanged) ---------------------------------------------------------
sigma_data: 0.5
sampler_steps: 32
s_churn: 10.0
s_noise: 1.0

# --- optimisation (same fine-tune recipe as the 256 companion) ---------------
mode: diffusion
batch: 8
lr: 2.0e-5
lr_schedule: cosine
warmup: 3125000               # = resume step
steps: 3185000                # 60k fine-tune steps
loss_reduction: masked_mean
grad_clip: 0.0
grad_nan_to_num: true
ema_halflife_kimg: 50
num_workers: 4

val_every: 10000
val_batches: 10

# --- sampling / eval ----------------------------------------------------------
k_members: 24
n_eval_days: 0

out: "${OUT_DIR:-/unity/g2/jvelasco/gitraw/hycom_sbda/aws_runs/runs}/prior_gulfstream_ft512"
