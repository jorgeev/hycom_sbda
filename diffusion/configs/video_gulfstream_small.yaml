# Multi-frame prior on the Gulf Stream HYCOM family -- SMALL-SIGMA EXPERT.
# This file is also the TEMPLATE for the video configs: every knob the temporal
# code reads is here, with what it does. The large-sigma expert
# (video_gulfstream_large.yaml) is this file with four keys changed.
#
# Design, following GenLLC4320 (see diffusion/README_video.md):
#   * the model denoises `n_frames` consecutive frames jointly, with attention
#     across time (arch: genllc_video, a port of GenLLC4320's ADM video UNet);
#   * calendar channels (local solar time, day of year) are given as inputs;
#   * TWO networks are trained on disjoint-ish noise ranges, drawn log-uniform,
#     and the sampler switches between them at `sigma_divide`.
# Differences from GenLLC4320, decided for this project:
#   * frames are HOURLY SNAPSHOTS straight from the store (no 12-hour means, no
#     tide / inertial filtering);
#   * wind stress is GENERATED, not a conditioning label (but see `label_vars`).
#
# Train both experts (each is an ordinary, independent run):
#   AWS   : CONFIG=diffusion/configs/video_gulfstream_small.yaml bash aws/launch_video.sh
#   local : sbatch train_video_lanes.slurm \
#             "diffusion/configs/video_gulfstream_small.yaml:1:2 \
#              diffusion/configs/video_gulfstream_large.yaml:1:3"
# Sample from the pair:
#   python -m diffusion.sample_video --small <run_small> --large <run_large>
dataset: diffusion/datasets/gulfstream.yaml

# --- channels -----------------------------------------------------------------
# Three lists decide what each store variable is. Edit them freely; the network's
# input and output widths follow.
#   target     generated by the model (noised, denoised, written by the sampler)
#   cond_vars  given to the model as clean per-frame INPUT channels, never
#              generated. Each is read at the frame's own time; a variable on a
#              slower cadence (daily, weekly) repeats across the hours it covers.
#   label_vars given to the model as ONE SCALAR PER FRAME -- the ocean-mean of
#              the normalised field over the patch -- through the embedding
#              (GenLLC4320's flux conditioning).
# A variable may be in `target` or in `label_vars`, not both.
#
# THE FLUX SWITCH. Wind stress is generated here. To test it as scalar labels
# instead, move the two names:
#     target:     [ssh, sst, sss, uag, vag]
#     label_vars: [tau_x, tau_y]
# (The store has no shortwave / heat-flux variable; tau_x and tau_y are its only
# forcing fields.)
target: [ssh, sst, sss, uag, vag, tau_x, tau_y]
cond_vars: []
label_vars: []
label_dropout: 0.0            # >0 drops labels at random in training (classifier-free guidance)
use_ocean_mask: false         # true = the ocean mask as one more input channel per frame
use_doy: false                # single-frame option; video models use `use_calendar`
k_days: 1                     # must stay 1: the window is n_frames x frame_stride

# --- time window --------------------------------------------------------------
# One sample = `n_frames` frames, `frame_stride` base-cadence steps apart (the
# base cadence of this dataset is hourly), all at the same crop. 5 and 1 = five
# consecutive hours. `n_frames` is FIXED PER CHECKPOINT: the temporal attention
# has a learned relative-position table of that length.
n_frames: 5
frame_stride: 1

# --- calendar inputs ----------------------------------------------------------
# 4 * calendar_harmonics input channels: cos/sin of k * local solar time (UTC
# hour shifted by each pixel's longitude) and of k * day of year, k = 1..6.
# Note the record covers 2017-01 to 2017-07 only, so the day-of-year channels
# have seen half a year.
use_calendar: true
calendar_harmonics: 6
lon_path: coords/lon          # 2-D per-pixel longitude (degrees east) in the store

# --- data / patches -----------------------------------------------------------
# Unchanged from the single-frame configs: a `patch` x `patch` crop from the
# full 576x936 domain, at a window start drawn at random from the train split.
# `patch` must divide by 2^(levels-1) = 16.
patch: 256
crop_mode: grid
reject_land: false
ocean_frac: 0.5
crops_per_day: 8
norm_mode: anomaly

# --- climatology (see prior_gulfstream_256.yaml for the full reasoning) --------
clim_vars: [sst, sss]
clim_mode: monthly
clim_full_record: true
val_gap_days: 0

# --- model: GenLLC4320's video UNet --------------------------------------------
# 5 levels at 256/128/64/32/16 px with 128/256/256/384/512 channels, 3 blocks
# each: about 160 M parameters. Spatial self-attention at 32 and 16 px, temporal
# attention at 64, 32 and 16 px, 64 channels per head -- GenLLC4320's placement.
#
# The two attention lists are ABSOLUTE RESOLUTIONS. Weights are stored by level,
# so when fine-tuning at another patch, scale the lists with it to keep
# attention on the same levels (patch 512: [64, 32] and [128, 64, 32]);
# `--init-from` refuses a mismatch and prints the lists to use.
arch: genllc_video
model_channels: 128
channel_mult: [1, 2, 2, 3, 4]
num_blocks: 3
attn_resolutions: [32, 16]
temporal_attn_resolutions: [64, 32, 16]
channels_per_head: 64
dropout: 0.10
# true : temporal attention is ADDED to its input, like spatial attention.
# false: GenLLC4320 as committed -- its output replaces the features.
temporal_attn_residual: true
grad_checkpoint: false        # true = less GPU memory, slower (for large patches)

# --- EDM / noise levels --------------------------------------------------------
# sigma_data 1.0: the data are normalised to unit-variance anomalies (GenLLC4320
# moved from 0.5 to 1.0 for the same reason).
sigma_data: 1.0
# The training draw: log-uniform on [train_sigma_min, train_sigma_max], one
# sigma per sample shared by all its frames. This is the small-sigma expert;
# the large one trains on [0.1, 200]. The ranges overlap on purpose around the
# switch point.
sigma_sampling: loguniform
train_sigma_min: 0.001
train_sigma_max: 1.0
expert: small
sigma_divide: 0.5             # the sampler uses the large expert above this sigma

# --- sampler (read from the LARGE expert's checkpoint at sampling time) ---------
sigma_min: 0.002
sigma_max: 200.0
rho: 7.0
# From sigma 200 the Heun sampler's discretisation error on a Gaussian test is
# +2 % in std at 32 steps and under 1 % at 64, so 64 here.
sampler_steps: 64
s_churn: 10.0
s_noise: 1.0

# --- optimisation --------------------------------------------------------------
# GenLLC4320's recipe: Adam, lr 2e-4, about 1000 steps of warm-up, cosine decay
# to zero over 10 M samples at a GLOBAL batch of 48.
#
#   global batch = batch (per GPU) x GPUs x accum
#
# `batch: 3` is roughly what the full-size network fits on an 80 GB A100 at
# 5 frames x 256^2. Reach 48 with any of:
#     16 GPUs x batch 3 x accum 1      (this file as written)
#      8 GPUs x batch 3 x accum 2      ACCUM=2 bash aws/launch_video.sh
#      1 GPU  x batch 3 x accum 16     local run-checks
# `steps` counts OPTIMISER steps: 208334 x 48 = 10 M samples. `warmup` is also
# in optimiser steps (1042 x 48 = 50 k samples).
#
# HOST RAM: every DDP rank preloads the whole hourly record of every listed
# variable -- 9.4 GB each, so 66 GB per rank for these seven (528 GB at 8 ranks,
# 1056 GB at 16). More frames cost nothing; more variables do.
mode: diffusion
batch: 3
accum: 1
lr: 2.0e-4
lr_schedule: cosine
warmup: 1042
steps: 208334
loss_reduction: masked_mean
grad_clip: 0.0
grad_nan_to_num: true
ema_halflife_kimg: 500
num_workers: 4

log_every: 100
ckpt_every: 1000
# Each validation round also writes an immutable snapshot under checkpoints/,
# about 2.6 GB for this network (weights + EMA + optimiser), so 21 rounds is
# roughly 55 GB per expert. Validation uses the same windows, noise and sigma
# quantiles every round.
val_every: 10000
val_batches: 8

# --- sampling -------------------------------------------------------------------
k_members: 8
n_eval_days: 8                # window starts used by sample_video by default

out: "${OUT_DIR:-/unity/f1/ozavala/DATA/JorgeVelasco/runs}/video_gulfstream_small"
