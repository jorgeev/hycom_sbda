# Multi-frame prior on the Gulf Stream HYCOM family: 6 FRAMES, TIDE-FREE SSH
# (`ssh_nt`), TIDAL PHASE LABELS -- SMALL-SIGMA EXPERT.
#
# video_gulfstream_tide_small.yaml with three changes, all marked below:
#   * the SSH channel is `ssh_nt` (ssh minus the 8-constituent harmonic fit, in
#     the stores since 2026-11-19) instead of `ssh`; the other six generated
#     variables are the same, so the model still has 7 channels;
#   * `n_frames: 6` instead of 5;
#   * `batch: 2` instead of 3, because 6 frames x batch 3 does not fit on an
#     80 GB A100 (see `batch` below).
# Every other key is the same; `out` is its own directory.
# The large-sigma expert is video_gulfstream_tide_nt_large.yaml; keep the two in
# step, sample_video refuses a pair whose channels, labels, window, calendar or
# normalisation differ. video_gulfstream_small.yaml is the commented template
# for every key not explained here.
#
# What changes for the model: the coherent tide was about half of the
# anomaly-normalised SSH channel and nearly all of its hour-to-hour change, and
# it is no longer something the network has to generate. The normalisation of
# `ssh_nt` is fit on its own (a new variable name is a new cache entry), so the
# channel is rescaled to unit variance without the tide.
#
# What does NOT change: `uag`/`vag` still contain the tidal currents, and the
# tidal labels below still tell the model the phase. The sampler writes
# `gen_ssh_nt` / `truth_ssh_nt`; adding the fitted tide back to get full SSH is
# not built.
#
# What the tidal labels are (diffusion/tides.py, diffusion/README_video.md):
# for every frame, cos and sin of the phase of each constituent listed, computed
# from the frame's timestamp and fed through the label embedding. The frames are
# hourly snapshots that contain the tide, and the calendar channels carry solar
# time only; these labels are what tells the model where each frame sits in the
# lunar cycle.
#
# A tide run starts from step 0: checkpoints of the label-free pair have no label
# layer and cannot be continued or used with --init-from here.
#
# Train both experts:
#   AWS   : CONFIG=diffusion/configs/video_gulfstream_tide_nt_small.yaml bash aws/launch_video.sh
#   local : sbatch train_video_lanes.slurm \
#             "diffusion/configs/video_gulfstream_tide_nt_small.yaml:1:2 \
#              diffusion/configs/video_gulfstream_tide_nt_large.yaml:1:3"
dataset: diffusion/datasets/gulfstream.yaml

target: [ssh_nt, sst, sss, uag, vag, tau_x, tau_y]     # ssh_nt in place of ssh; still 7 channels
cond_vars: []
label_vars: []
# The eight constituents of the harmonic fit, in its term order -> 16 labels per
# frame. P1 and K2 separate from K1 and S2 only over 182.6 days, about the length
# of this record: the validation months hold K1-P1 and S2-K2 phase differences
# the training months never show. Drop those two names for a 12-label variant.
tidal_labels: [K1, O1, P1, Q1, M2, S2, N2, K2]
tidal_epoch: 1483232400       # 2017-01-01T01:00:00Z, the fit's phase origin (unix seconds)
label_dropout: 0.0            # >0 would drop the tidal phases together with any label_vars
use_ocean_mask: false
use_doy: false
k_days: 1

n_frames: 6                   # 6 hourly frames per window (the tide pair has 5)
frame_stride: 1

use_calendar: true
calendar_harmonics: 6
lon_path: coords/lon

patch: 256
crop_mode: grid
reject_land: false
ocean_frac: 0.5
crops_per_day: 8
norm_mode: anomaly

clim_vars: [sst, sss]
clim_mode: monthly
clim_full_record: true
val_gap_days: 0

arch: genllc_video
model_channels: 128
channel_mult: [1, 2, 2, 3, 4]
num_blocks: 3
attn_resolutions: [32, 16]
temporal_attn_resolutions: [64, 32, 16]
channels_per_head: 64
dropout: 0.10
temporal_attn_residual: true
grad_checkpoint: false

sigma_data: 1.0
sigma_sampling: loguniform
train_sigma_min: 0.001
train_sigma_max: 1.0
expert: small
sigma_divide: 0.5

sigma_min: 0.002
sigma_max: 200.0
rho: 7.0
sampler_steps: 64
s_churn: 10.0
s_noise: 1.0

mode: diffusion
# Per-GPU batch. GPU memory follows the number of frames, about 4.4 GB per
# sample per frame: at 6 frames the largest batch on an 80 GB A100 is 2 (55 GB,
# 0.38 s per sample, measured 2026-11-18 with synthetic tensors); batch 3 does
# not fit. The recipe is written for a GLOBAL batch of 48 = batch x GPUs x accum,
# so with batch 2 that is 24 GPU-rounds: 8 GPUs x accum 3, 4 GPUs x accum 6, or
# 1 GPU x accum 24. aws/launch_video.sh prints the product and the ACCUM to set.
# Alternative: `grad_checkpoint: true` fits batch 12 at 6 frames (66 GB) at
# 0.47 s per sample, about 24% slower.
batch: 2
accum: 1
lr: 2.0e-4
lr_schedule: cosine
warmup: 1042
steps: 208334
loss_reduction: masked_mean
grad_clip: 0.0
grad_nan_to_num: true
ema_halflife_kimg: 500
num_workers: 4

log_every: 100
ckpt_every: 1000
val_every: 10000
val_batches: 8

k_members: 8
n_eval_days: 8

out: "${OUT_DIR:-/unity/f1/ozavala/DATA/JorgeVelasco/runs}/video_gulfstream_tide_nt_small"
